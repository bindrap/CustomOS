# ═══════════════════════════════════════════════════════════════
# NOTES
# ═══════════════════════════════════════════════════════════════
#
# To add packages:
#   1. Add package name to appropriate section
#   2. Run: bash create-offline-cache.sh
#   3. Run: bash build-iso.sh
#
# To remove packages:
#   1. Comment out with # or delete the line
#   2. Rebuild cache and ISO
#
# To find package names:
#   pacman -Ss search-term
#
# AUR packages:
#   - Marked with "# AUR package" comment
#   - Need to be installed separately with yay/paru
#   - Not included in offline cache
#
# Size considerations:
#   - Each package adds to ISO size
#   - Desktop environments can add 500MB-2GB
#   - Development tools add 200-500MB
#   - Gaming tools add 1-3GB
#
# ═══════════════════════════════════════════════════════════════
