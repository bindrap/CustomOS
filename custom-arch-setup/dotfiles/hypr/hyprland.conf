# CustomOS - Enhanced Hyprland Configuration with Hyde-inspired features

# Import theme colors (auto-generated by theme-apply.sh)
source = ~/.config/hypr/colors.conf

#################
### MONITORS ###
#################

# Default monitor configuration
monitor=,preferred,auto,1

# Multi-monitor examples (uncomment and adjust as needed):
# monitor=DP-1,2560x1440@144,0x0,1
# monitor=HDMI-A-1,1920x1080@60,2560x0,1
#
# Per-monitor workspaces:
# workspace=1,monitor:DP-1,default:true
# workspace=2,monitor:DP-1
# workspace=3,monitor:HDMI-A-1,default:true


###################
### MY PROGRAMS ###
###################

$terminal = kitty -o shell=zsh -o login_shell=yes
$fileManager = thunar
$menu = wofi --show drun --style ~/.config/wofi/style.css
$browser = firefox
$editor = kitty -e nvim
$music = spotify
$scrPath = ~/.config/hypr/scripts


#################
### AUTOSTART ###
#################

exec-once = waybar &
exec-once = mako &
exec-once = wl-paste --watch cliphist store &
exec-once = swww-daemon || hyprpaper &
exec-once = $scrPath/theme-apply.sh
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2

    # Colors are now loaded from ~/.config/hypr/colors.conf
    # Use 'theme-select.sh' to change themes

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
    no_border_on_floating = false
}

decoration {
    rounding = 4  # Rounded corners (set to 0 for square)

    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    drop_shadow = true
    shadow_range = 8
    shadow_render_power = 2
    shadow_offset = 0 2

    dim_inactive = false
    dim_strength = 0.05

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = true
        vibrancy = 0.2
    }
}

animations {
    enabled = true

    # Hyde-inspired smooth animations
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = smooth, 0.25, 1, 0.5, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 10, liner
    animation = borderangle, 1, 100, liner, loop
    animation = fade, 1, 5, smooth
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 5, smooth
    animation = workspaces, 1, 6, wind, slide
    animation = specialWorkspace, 1, 6, wind, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc { 
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 0
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0
    
    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGS ###
####################

$mainMod = SUPER

# Application Launchers
bind = $mainMod, T, exec, $terminal
bind = $mainMod Alt, T, exec, [float; move 20% 5%; size 60% 60%] $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, code
bind = $mainMod, N, exec, $terminal -e sh -c 'cd ~/Documents/Notes && nvim'
bind = $mainMod, O, exec, obsidian
bind = $mainMod, M, exec, kitty -e ncmpcpp
bind = $mainMod Alt, M, exec, spotify
bind = $mainMod, D, exec, discord
bind = Control Shift, Escape, exec, kitty -e btop

# Rofi/Wofi Launchers
bind = $mainMod, A, exec, $menu
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, slash, exec, $scrPath/keybinds-hint.sh
bind = $mainMod, comma, exec, $scrPath/emoji-picker.sh

# Window Management
bind = $mainMod, Q, killactive
bind = Alt, F4, killactive
bind = $mainMod, Delete, exit
bind = $mainMod, W, togglefloating
bind = $mainMod Shift, F, pin
bind = $mainMod, F, fullscreen, 0
bind = Shift, F11, fullscreen, 0
bind = $mainMod, J, togglesplit

# Window Focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = Alt, Tab, cyclenext

# Window Resize
binde = $mainMod Shift, Right, resizeactive, 30 0
binde = $mainMod Shift, Left, resizeactive, -30 0
binde = $mainMod Shift, Up, resizeactive, 0 -30
binde = $mainMod Shift, Down, resizeactive, 0 30

# Move Window
binde = $mainMod Shift Control, Left, movewindow, l
binde = $mainMod Shift Control, Right, movewindow, r
binde = $mainMod Shift Control, Up, movewindow, u
binde = $mainMod Shift Control, Down, movewindow, d

# Move/Resize with Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod Shift, 1, movetoworkspace, 1
bind = $mainMod Shift, 2, movetoworkspace, 2
bind = $mainMod Shift, 3, movetoworkspace, 3
bind = $mainMod Shift, 4, movetoworkspace, 4
bind = $mainMod Shift, 5, movetoworkspace, 5
bind = $mainMod Shift, 6, movetoworkspace, 6
bind = $mainMod Shift, 7, movetoworkspace, 7
bind = $mainMod Shift, 8, movetoworkspace, 8
bind = $mainMod Shift, 9, movetoworkspace, 9
bind = $mainMod Shift, 0, movetoworkspace, 10

# Move window silently
bind = $mainMod Alt, 1, movetoworkspacesilent, 1
bind = $mainMod Alt, 2, movetoworkspacesilent, 2
bind = $mainMod Alt, 3, movetoworkspacesilent, 3
bind = $mainMod Alt, 4, movetoworkspacesilent, 4
bind = $mainMod Alt, 5, movetoworkspacesilent, 5
bind = $mainMod Alt, 6, movetoworkspacesilent, 6
bind = $mainMod Alt, 7, movetoworkspacesilent, 7
bind = $mainMod Alt, 8, movetoworkspacesilent, 8
bind = $mainMod Alt, 9, movetoworkspacesilent, 9
bind = $mainMod Alt, 0, movetoworkspacesilent, 10

# Relative workspace navigation
bind = $mainMod Control, Right, workspace, r+1
bind = $mainMod Control, Left, workspace, r-1
bind = $mainMod Control, Down, workspace, empty

# Scratchpad
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod Shift, S, movetoworkspace, special
bind = $mainMod Alt, S, movetoworkspacesilent, special

# Mouse workspace switching
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Screenshots & Recording
bind = $mainMod, P, exec, $scrPath/screenshot-area.sh
bind = $mainMod Shift, P, exec, hyprpicker -an
bind = , Print, exec, $scrPath/screenshot-full.sh
bind = $mainMod, R, exec, $scrPath/screen-record.sh

# Audio controls
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness controls (laptop)
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Wallpaper controls
bind = $mainMod Alt, Right, exec, $scrPath/wallpaper-next.sh
bind = $mainMod Alt, Left, exec, $scrPath/wallpaper-prev.sh
bind = $mainMod Shift, W, exec, $scrPath/wallpaper-select.sh
bind = $mainMod Control, W, exec, $scrPath/wallpaper-random.sh

# Theme controls
bind = $mainMod Shift, T, exec, $scrPath/theme-select.sh

# Game Mode toggle
bind = $mainMod, G, exec, $scrPath/gamemode-toggle.sh

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Logout menu
bind = Control Alt, Delete, exec, $scrPath/logout-menu.sh


##############################
### WINDOWS AND WORKSPACES ###
##############################

# General window rules
windowrulev2 = suppressevent maximize, class:.*

# Floating windows with specific positioning
windowrulev2 = float, class:(pavucontrol)
windowrulev2 = size 800 600, class:(pavucontrol)
windowrulev2 = center, class:(pavucontrol)

windowrulev2 = float, class:(blueman-manager)
windowrulev2 = size 700 500, class:(blueman-manager)
windowrulev2 = center, class:(blueman-manager)

windowrulev2 = float, class:(nm-connection-editor)
windowrulev2 = size 600 500, class:(nm-connection-editor)
windowrulev2 = center, class:(nm-connection-editor)

windowrulev2 = float, title:(Picture-in-Picture)
windowrulev2 = pin, title:(Picture-in-Picture)
windowrulev2 = size 25% 25%, title:(Picture-in-Picture)
windowrulev2 = move 72% 72%, title:(Picture-in-Picture)

# File picker dialogs
windowrulev2 = float, title:(Open File)
windowrulev2 = float, title:(Save File)
windowrulev2 = float, title:(Select)
windowrulev2 = size 60% 70%, title:(Open File)
windowrulev2 = center, title:(Open File)

# Opacity rules
windowrulev2 = opacity 0.95 0.90, class:(kitty)
windowrulev2 = opacity 0.95 0.90, class:(code)
windowrulev2 = opacity 0.95 0.90, class:(Code)
windowrulev2 = opacity 0.95 0.90, class:(obsidian)
windowrulev2 = opacity 0.90 0.85, class:(thunar)
windowrulev2 = opacity 0.90 0.85, class:(Thunar)

# Workspace assignments (optional - uncomment to use)
# windowrulev2 = workspace 2 silent, class:(firefox)
# windowrulev2 = workspace 3 silent, class:(discord)
# windowrulev2 = workspace 3 silent, class:(Discord)
# windowrulev2 = workspace 4 silent, class:(spotify)
# windowrulev2 = workspace 4 silent, class:(Spotify)
# windowrulev2 = workspace 5 silent, class:(obs)

# Special window behaviors
windowrulev2 = idleinhibit focus, class:(mpv)
windowrulev2 = idleinhibit fullscreen, class:(firefox)
windowrulev2 = idleinhibit fullscreen, class:(chromium)

# Tearing for games (reduce latency)
windowrulev2 = immediate, class:(steam_app)
windowrulev2 = immediate, class:(cs2)
windowrulev2 = immediate, class:(dota2)


