# Greetd configuration for PBOS
# Using tuigreet with custom launch script for ASCII art

[terminal]
vt = 1

[default_session]
# Use tuigreet with PBOS launcher (shows ASCII art before Hyprland)
command = "tuigreet --time --remember --remember-session --cmd /usr/local/bin/launch-hyprland"
user = "greeter"
