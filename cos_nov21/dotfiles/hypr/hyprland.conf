# CustomOS - Hyde-style Hyprland Configuration
# Enhanced with wallpaper pickers, theme switchers, and more

#################
### MONITORS ###
#################

monitor=,preferred,auto,1


####################
### THEME COLORS ###
####################

# Source theme colors (generated by theme-apply.sh)
source = ~/.config/hypr/colors.conf


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$browser = firefox
$musicPlayer = ncmpcpp
$menu = wofi --show drun
$super = SUPER


#################
### AUTOSTART ###
#################

# Essential components
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Wallpaper daemon (Hyde-style with swww for smooth transitions)
exec-once = swww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper-random.sh 

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 3

    col.active_border = rgba(89b4faee) rgba(94e2d5ee) 45deg
    col.inactive_border = rgba(3b3b4b88)

    layout = dwindle
}

decoration {
    rounding = 12

    active_opacity = 0.96
    inactive_opacity = 0.86

    drop_shadow = true
    shadow_range = 24
    shadow_render_power = 3
    col.shadow = rgba(00000055)

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.015
        contrast = 1.05
        brightness = 1.02
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInBack, 0.36, -0.08, 0.68, -0.48
    bezier = fastSpring, 0.26, 1, 0.48, 1

    animation = windows, 1, 8, easeOutQuint, popin 80%
    animation = windowsOut, 1, 7, easeInBack, popin 80%
    animation = border, 1, 12, fastSpring
    animation = fade, 1, 7, easeOutQuint
    animation = workspaces, 1, 6, easeOutQuint, slidevert
    animation = specialWorkspace, 1, 6, easeOutQuint, slidevert
    animation = layers, 1, 7, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}


####################
### KEYBINDINGS ###
####################

# Use ALT as mod key (easier for VMs)
$mod = ALT

# Essential bindings
bind = $mod, T, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, $fileManager
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, A, exec, $menu
bind = $mod, P, pseudo
bind = $mod, J, togglesplit

# Audio controls with notifications
bindle = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume-notify.sh up
bindle = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume-notify.sh down
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume-notify.sh mute
bind = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/mic-notify.sh toggle

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mod, Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Reload waybar
bind = $mod SHIFT, R, exec, pkill waybar && waybar &

# Hyde-style Customization Shortcuts
bind = $mod, C, exec, ~/.config/hypr/scripts/hyde-menu.sh                  # Hyde customization menu
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-select.sh     # Wallpaper picker
bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/theme-select.sh         # Theme switcher
bind = $mod CTRL, Right, exec, ~/.config/hypr/scripts/wallpaper-next.sh    # Next wallpaper
bind = $mod CTRL, Left, exec, ~/.config/hypr/scripts/wallpaper-prev.sh     # Previous wallpaper
bind = $mod CTRL, Up, exec, ~/.config/hypr/scripts/wallpaper-random.sh     # Random wallpaper
bind = $mod, H, exec, ~/.config/hypr/scripts/keybinds-hint.sh              # Show keybindings

# Super key quick launchers (install on demand)
bind = $super, E, exec, ~/.config/hypr/scripts/app-launch.sh files
bind = $super, N, exec, ~/.config/hypr/scripts/app-launch.sh nvim
bind = $super, B, exec, ~/.config/hypr/scripts/app-launch.sh browser
bind = $super, M, exec, ~/.config/hypr/scripts/app-launch.sh music

# Focus windows
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
