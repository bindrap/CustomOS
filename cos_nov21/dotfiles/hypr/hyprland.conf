# CustomOS - Hyde-style Hyprland Configuration
# Enhanced with wallpaper pickers, theme switchers, and more

#################
### MONITORS ###
#################

monitor=,preferred,auto,1


####################
### THEME COLORS ###
####################

# Source theme colors (generated by theme-apply.sh)
# source = ~/.config/hypr/colors.conf


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$browser = brave
$musicPlayer = ncmpcpp
$menu = wofi --show drun
$super = SUPER


#################
### AUTOSTART ###
#################

# Essential components
exec-once = ~/.config/waybar/scripts/start-waybar.sh
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Wallpaper daemon (Hyde-style with swww for smooth transitions)
exec-once = swww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper-random.sh 

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(89b4faee) rgba(94e2d5ee) 45deg
    col.inactive_border = rgba(3b3b4b88)

    layout = dwindle
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000088)
        color_inactive = rgba(00000044)
    }

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = false
        xray = false
        noise = 0.02
        contrast = 1.1
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.2
        popups = true
        popups_ignorealpha = 0.6
    }
}

animations {
    enabled = true

    # macOS-like smooth bezier curves
    bezier = macCurve, 0.32, 0.64, 0.45, 1
    bezier = macSpring, 0.5, 1.2, 0.4, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, macCurve, slide
    animation = windowsOut, 1, 5, smoothOut, slide
    animation = windowsMove, 1, 4, macCurve, slide
    animation = border, 1, 10, macCurve
    animation = fade, 1, 4, macCurve
    animation = workspaces, 1, 5, macCurve, slide
    animation = specialWorkspace, 1, 5, macSpring, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}


####################
### KEYBINDINGS ###
####################

# Use SUPER (Windows key) as mod key
$mod = SUPER

# Essential bindings
bind = $mod, T, exec, $terminal
bind = $mod, Q, killactive
bind = $mod SHIFT, M, exit
bind = $mod, E, exec, $fileManager
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, A, exec, $menu
bind = $mod, P, pseudo
bind = $mod, J, togglesplit

# Audio controls with notifications
bindle = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume-notify.sh up
bindle = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume-notify.sh down
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume-notify.sh mute
bind = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/mic-notify.sh toggle

# Log out when the laptop lid closes
bindl = , switch:off:Lid, exec, hyprctl dispatch exit

# Screenshots
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh

# Reload waybar (with color watcher)
bind = $mod SHIFT, R, exec, ~/.config/waybar/scripts/start-waybar.sh

# Hyde-style Customization Shortcuts
bind = $mod, C, exec, ~/.config/hypr/scripts/hyde-menu.sh                  # Hyde customization menu
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-select.sh     # Wallpaper picker
bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/theme-select.sh         # Theme switcher
bind = $mod CTRL, Right, exec, ~/.config/hypr/scripts/wallpaper-next.sh    # Next wallpaper
bind = $mod CTRL, Left, exec, ~/.config/hypr/scripts/wallpaper-prev.sh     # Previous wallpaper
bind = $mod CTRL, Up, exec, ~/.config/hypr/scripts/wallpaper-random.sh     # Random wallpaper
bind = $mod, H, exec, ~/.config/hypr/scripts/keybinds-hint.sh              # Show keybindings

# Music player
bind = $mod, M, exec, kitty --working-directory ~/Music -e ncmpcpp

# Super key quick launchers (install on demand)
bind = $super, E, exec, ~/.config/hypr/scripts/app-launch.sh files
bind = $super, N, exec, ~/.config/hypr/scripts/app-launch.sh nvim
bind = $super, B, exec, ~/.config/hypr/scripts/app-launch.sh browser
bind = $super, A, exec, $menu

# Focus windows
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


##############################
### WINDOW RULES & EFFECTS ###
##############################

# Frosted glass effect for floating windows
windowrulev2 = opacity 0.92 0.88, floating:1
windowrulev2 = rounding 12, floating:1

# Specific app rules with frosted glass
windowrulev2 = opacity 0.88 0.84, class:^(wofi)$
windowrulev2 = opacity 0.90 0.86, class:^(Rofi)$
windowrulev2 = opacity 0.92 0.88, class:^(thunar)$
windowrulev2 = opacity 0.88 0.84, class:^(pavucontrol)$
windowrulev2 = opacity 0.88 0.84, class:^(nm-connection-editor)$
windowrulev2 = opacity 0.88 0.84, class:^(blueman-manager)$
windowrulev2 = opacity 0.85 0.80, class:^(kitty)$

# Center network and bluetooth managers
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# Picture-in-Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = opacity 1.0 1.0, title:^(Picture-in-Picture)$

# Layer rules for blur
layerrule = blur, waybar
layerrule = blur, notifications
layerrule = blur, wofi
layerrule = blur, rofi
layerrule = blur, eww
layerrule = ignorezero, waybar
layerrule = ignorezero, notifications
layerrule = ignorezero, eww
