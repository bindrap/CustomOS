# Parteek's Custom Minimal Hyprland Configuration

#################
### MONITORS ###
#################

monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

$terminal = kitty -o shell=zsh -o login_shell=yes
$fileManager = thunar
$menu = wofi --show drun
$browser = firefox
$editor = kitty -e nvim
$music = spotify


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = mako
exec-once = wl-paste --watch cliphist store
exec-once = hyprpaper


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1


#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    
    # Catppuccin Mocha colors
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(313244aa)
    
    # Decay Green alternative (uncomment to use)
    # col.active_border = rgba(90ceaaff) rgba(78dba9ff) 45deg
    # col.inactive_border = rgba(242832aa)
    
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0  # Square corners
    
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0
    
    drop_shadow = false
    
    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = true
    }
}

animations {
    enabled = true
    
    # Smooth and fast, minimal style
    bezier = myBezier, 0.05, 0.9, 0.1, 1.0
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    
    animation = windows, 1, 3, myBezier, slide
    animation = windowsOut, 1, 3, myBezier, slide
    animation = border, 1, 5, linear
    animation = borderangle, 1, 50, linear, loop
    animation = fade, 1, 4, myBezier
    animation = workspaces, 1, 4, myBezier, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc { 
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 0
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0
    
    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGS ###
####################

$mainMod = SUPER
$scrPath = ~/.config/hypr/scripts

# Application Launchers
bind = $mainMod, T, exec, $terminal
bind = $mainMod Alt, T, exec, [float; move 20% 5%; size 60% 60%] $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, code
bind = $mainMod, N, exec, $terminal -e sh -c 'cd ~/Documents/Notes && nvim'
bind = $mainMod, O, exec, obsidian
bind = $mainMod, M, exec, kitty -e ncmpcpp
bind = $mainMod Alt, M, exec, spotify
bind = $mainMod, D, exec, discord
bind = Control Shift, Escape, exec, kitty -e btop

# Rofi/Wofi Launchers
bind = $mainMod, A, exec, $menu
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/keybinds-hint.sh
bind = $mainMod, comma, exec, ~/.config/hypr/scripts/emoji-picker.sh

# Window Management
bind = $mainMod, Q, killactive
bind = Alt, F4, killactive
bind = $mainMod, Delete, exit
bind = $mainMod, W, togglefloating
bind = $mainMod Shift, F, pin
bind = $mainMod, F, fullscreen, 0
bind = Shift, F11, fullscreen, 0
bind = $mainMod, J, togglesplit

# Window Focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = Alt, Tab, cyclenext

# Window Resize
binde = $mainMod Shift, Right, resizeactive, 30 0
binde = $mainMod Shift, Left, resizeactive, -30 0
binde = $mainMod Shift, Up, resizeactive, 0 -30
binde = $mainMod Shift, Down, resizeactive, 0 30

# Move Window
binde = $mainMod Shift Control, Left, movewindow, l
binde = $mainMod Shift Control, Right, movewindow, r
binde = $mainMod Shift Control, Up, movewindow, u
binde = $mainMod Shift Control, Down, movewindow, d

# Move/Resize with Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod Shift, 1, movetoworkspace, 1
bind = $mainMod Shift, 2, movetoworkspace, 2
bind = $mainMod Shift, 3, movetoworkspace, 3
bind = $mainMod Shift, 4, movetoworkspace, 4
bind = $mainMod Shift, 5, movetoworkspace, 5
bind = $mainMod Shift, 6, movetoworkspace, 6
bind = $mainMod Shift, 7, movetoworkspace, 7
bind = $mainMod Shift, 8, movetoworkspace, 8
bind = $mainMod Shift, 9, movetoworkspace, 9
bind = $mainMod Shift, 0, movetoworkspace, 10

# Move window silently
bind = $mainMod Alt, 1, movetoworkspacesilent, 1
bind = $mainMod Alt, 2, movetoworkspacesilent, 2
bind = $mainMod Alt, 3, movetoworkspacesilent, 3
bind = $mainMod Alt, 4, movetoworkspacesilent, 4
bind = $mainMod Alt, 5, movetoworkspacesilent, 5
bind = $mainMod Alt, 6, movetoworkspacesilent, 6
bind = $mainMod Alt, 7, movetoworkspacesilent, 7
bind = $mainMod Alt, 8, movetoworkspacesilent, 8
bind = $mainMod Alt, 9, movetoworkspacesilent, 9
bind = $mainMod Alt, 0, movetoworkspacesilent, 10

# Relative workspace navigation
bind = $mainMod Control, Right, workspace, r+1
bind = $mainMod Control, Left, workspace, r-1
bind = $mainMod Control, Down, workspace, empty

# Scratchpad
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod Shift, S, movetoworkspace, special
bind = $mainMod Alt, S, movetoworkspacesilent, special

# Mouse workspace switching
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Screenshots
bind = $mainMod, P, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod Shift, P, exec, hyprpicker -an
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# Audio controls
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness controls (laptop)
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Wallpaper controls
bind = $mainMod Alt, Right, exec, ~/.config/hypr/scripts/wallpaper-next.sh
bind = $mainMod Alt, Left, exec, ~/.config/hypr/scripts/wallpaper-prev.sh
bind = $mainMod Shift, W, exec, ~/.config/hypr/scripts/wallpaper-select.sh

# Theme controls
bind = $mainMod Shift, T, exec, ~/.config/hypr/scripts/theme-select.sh

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Logout menu
bind = Control Alt, Delete, exec, ~/.config/hypr/scripts/logout-menu.sh


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:(pavucontrol)
windowrulev2 = float, class:(blueman-manager)
windowrulev2 = float, title:(Picture-in-Picture)
windowrulev2 = pin, title:(Picture-in-Picture)
windowrulev2 = opacity 0.95 0.95, class:(kitty)
windowrulev2 = opacity 0.95 0.95, class:(code)
windowrulev2 = opacity 0.95 0.95, class:(obsidian)


